name: NeuralOps Benchmark CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:    # manual trigger from GitHub UI

jobs:
  benchmark:
    name: Multi-LLM Benchmark Arena
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install SDK dependencies
        run: pip install -r sdk/requirements.txt

      - name: Run benchmark arena
        id: benchmark
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NEURALOPS_ENDPOINT: "http://localhost:8000"
        run: |
          cd $GITHUB_WORKSPACE
          python -c "
          import asyncio, sys, os, json
          sys.path.insert(0, 'sdk')
          sys.path.insert(0, '.')

          from server.agents.benchmark import BenchmarkArena

          PROMPTS = [
              'Explain the CAP theorem in one sentence.',
              'What is the difference between consistency and availability in distributed systems?',
              'Why does observability matter for AI agents in production?',
          ]

          async def run():
              arena = BenchmarkArena()
              all_results = []
              for prompt in PROMPTS:
                  result = await arena.run(prompt, max_tokens=256)
                  all_results.append({
                      'prompt': prompt,
                      'winner': str(result.winner),
                      'results': [
                          {
                              'provider': str(r.provider),
                              'model': r.model,
                              'quality': r.quality_score,
                              'latency_ms': r.latency_ms,
                              'error': r.error,
                          }
                          for r in result.results
                      ]
                  })
                  print(result.summary())
                  print()
              with open('benchmark_results.json', 'w') as f:
                  json.dump(all_results, f, indent=2)
              return all_results

          results = asyncio.run(run())
          " 2>&1 | tee benchmark_output.txt

      - name: Generate markdown report
        id: report
        run: |
          python -c "
          import json, os

          if not os.path.exists('benchmark_results.json'):
              report = '## NeuralOps Benchmark\n\nBenchmark did not produce results. Check the benchmark step logs.'
              with open('benchmark_report.md', 'w') as f:
                  f.write(report)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                  f.write(report)
              exit(0)

          with open('benchmark_results.json') as f:
              data = json.load(f)

          lines = ['## NeuralOps Benchmark Results', '']
          lines.append('> Auto-generated by NeuralOps CI on every push')
          lines.append('')

          for run in data:
              lines.append(f'### {run[\"prompt\"]}')
              lines.append('')
              lines.append('| Provider | Model | Quality | Latency | Status |')
              lines.append('|---|---|---|---|---|')
              successful = [r for r in run['results'] if not r['error']]
              failed = [r for r in run['results'] if r['error']]
              for r in sorted(successful, key=lambda x: -(x['quality'] or 0)):
                  winner = ' **WINNER**' if str(run['winner']) == r['provider'] else ''
                  lines.append(
                      f\"| {r['provider'].replace('Provider.', '')} \"\
                      f\"| {r['model']} \"\
                      f\"| {r['quality']:.1f}/10 \"\
                      f\"| {r['latency_ms']:.0f}ms \"\
                      f\"| FREE{winner} |\"
                  )
              for r in failed:
                  lines.append(
                      f\"| {r['provider'].replace('Provider.', '')} \"\
                      f\"| {r['model']} | - | - | {r['error'][:40]} |\"
                  )
              lines.append('')

          report = '\n'.join(lines)
          print(report)

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(report)

          with open('benchmark_report.md', 'w') as f:
              f.write(report)
          "

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('benchmark_report.md', 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report,
            });

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark_results.json
            benchmark_report.md
            benchmark_output.txt
          retention-days: 30

      - name: Fail if all providers failed
        run: |
          python -c "
          import json
          with open('benchmark_results.json') as f:
              data = json.load(f)
          total = sum(len(r['results']) for r in data)
          failed = sum(1 for run in data for r in run['results'] if r['error'])
          success_rate = (total - failed) / total
          print(f'Success rate: {success_rate:.0%} ({total-failed}/{total} providers)')
          if success_rate < 0.3:
              print('ERROR: Less than 30% of providers succeeded')
              exit(1)
          "
