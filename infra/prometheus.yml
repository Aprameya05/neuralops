# NeuralOps Prometheus Configuration
#
# Scrapes the NeuralOps API /metrics endpoint and the OTel collector.
# Run with: docker run -p 9090:9090 -v $(pwd)/prometheus.yml:/etc/prometheus/prometheus.yml prom/prometheus

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    monitor: neuralops
    environment: production

# Alerting rules
rule_files:
  - "neuralops_alerts.yml"

# Alertmanager (optional -- configure if you have one)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]

scrape_configs:
  # NeuralOps FastAPI /metrics
  - job_name: neuralops-api
    scrape_interval: 30s
    scrape_timeout: 10s
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets:
          - neuralops-api-cmgf.onrender.com
        labels:
          service: neuralops-api
          env: production

  # OTel Collector internal metrics (if running locally)
  - job_name: otel-collector
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets:
          - localhost:8888
        labels:
          service: otel-collector

  # OTel Collector pipeline metrics
  - job_name: otel-collector-pipeline
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets:
          - localhost:8889
        labels:
          service: otel-collector-pipeline
